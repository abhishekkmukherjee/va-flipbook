<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedant Wealth | Coming Soon</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Logo -->
    <div class="logo">
        <div class="flex items-center">
            <div class="gradient-text text-3xl font-bold">FinTech</div>
            <div class="ml-2 bg-gradient-to-r from-green-400 to-blue-500 h-8 w-8 rounded-full"></div>
        </div>
    </div>
    
    <!-- Hero Section -->
    <section class="hero-bg min-h-screen flex items-center justify-center px-6 md:px-12 py-20">
        <div class="container mx-auto">
            <div class="flex flex-col lg:flex-row items-center justify-between relative">
                <div class="lg:w-1/2 mb-16 lg:mb-0 z-20">
                    <span class="inline-block text-xs uppercase tracking-widest text-gray-400 mb-4 fade-in-up">Coming Soon</span>
                    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold leading-tight mb-6 fade-in-up delay-200">
                        The Future of <span class="gradient-text glow">Finance</span>
                    </h1>
                    <p class="text-gray-400 text-lg mb-10 max-w-lg fade-in-up delay-400">
                        Redefining how you experience financial services. Building something extraordinary for the modern age.
                    </p>
                    <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 fade-in-up delay-600">
                        <a href="vedantwealth.pdf" download class="animated-gradient text-black font-medium py-3 px-8 rounded-full hover:opacity-90 transition-all duration-300">
                            Download Brochure
                        </a>
                        <button class="bg-transparent border border-gray-700 hover:border-gray-500 text-white font-medium py-3 px-8 rounded-full transition-all duration-300">
                            Learn More
                        </button>
                    </div>
                </div>
                
                <div class="lg:w-1/2 flex justify-center lg:justify-end relative">
                    <div class="qr-code p-8 rounded-2xl flex flex-col items-center">
                        <img src="qr.webp" alt="QR Code" class="mb-4 rounded-lg pulse">
                        <p class="text-center text-gray-300 mb-2 text-lg">Scan the QR code</p>
                        <p class="text-center text-gray-400 text-base max-w-xs">
                            to get to know our product offerings and join the revolution
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
